<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>The Workshop has moved</title>
<link rel="canonical" href="https://workshop.veritythink.com/">
<script>
(function () {
  var prefix = '/av_instinctagent';
  var path = window.location.pathname;
  var suffix = path === prefix ? '/' : path.indexOf(prefix + '/') === 0 ? path.slice(prefix.length) : '/';
  var target = new URL('https://workshop.veritythink.com/');
  target.pathname = suffix;
  target.search = window.location.search;
  target.hash = window.location.hash;
  window.workshopDestination = target.href;
  window.setTimeout(function () { window.location.replace(target.href); }, 1200);
})();
</script>
<noscript><meta http-equiv="refresh" content="3;url=https://workshop.veritythink.com/"></noscript>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#f7f4ee;color:#202020;font:18px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:640px;width:100%;padding:44px 36px;border-top:5px solid #a32323;background:#fff;border-radius:4px;box-shadow:0 12px 40px #2020200a}p{margin:16px 0}h1{font:normal clamp(32px,7vw,46px)/1.15 Georgia,serif;margin:0 0 24px}a{color:#a32323;text-underline-offset:5px}a:focus-visible{outline:3px solid #a32323;outline-offset:5px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#6a6262;margin:0 0 20px}.address{overflow-wrap:anywhere;font-size:15px;color:#5c5656}
</style>
</head>
<body>
<main>
<p class="label">A new home. Same curiosity.</p>
<h1>The Workshop has moved</h1>
<p>You're being redirected to the new site.</p>
<p><a id="destination" href="https://workshop.veritythink.com/">The Workshop has moved</a></p>
<p class="address">workshop.veritythink.com</p>
</main>
<script>if(window.workshopDestination){document.getElementById('destination').href=window.workshopDestination;}</script>
</body>
</html>
